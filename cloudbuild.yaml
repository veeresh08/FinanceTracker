# WealthFlow CI/CD Pipeline
# Automatically builds and deploys to Cloud Run on every push to main branch

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/horizontal-data-435605-b9/cloud-run-source-deploy/wealthflow:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/horizontal-data-435605-b9/cloud-run-source-deploy/wealthflow:latest'
      - '.'
    id: 'build-docker-image'

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/horizontal-data-435605-b9/cloud-run-source-deploy/wealthflow'
    id: 'push-docker-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'wealthflow'
      - '--image=us-central1-docker.pkg.dev/horizontal-data-435605-b9/cloud-run-source-deploy/wealthflow:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3001'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-to-cloud-run'

# Store the images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/horizontal-data-435605-b9/cloud-run-source-deploy/wealthflow:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/horizontal-data-435605-b9/cloud-run-source-deploy/wealthflow:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Timeout for the entire build (20 minutes)
timeout: '1200s'

